services:
  fumo-gateway:
    image: ghcr.io/sleroq/fumo-gateway:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    command: ["--config", "/config/gateway.json"]
    volumes:
      - ./gateway.json:/config/gateway.json:ro
      - fumo-data:/data

volumes:
  fumo-data:
